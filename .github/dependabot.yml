# SPDX-License-Identifier: MPL-2.0
version: 2

multi-ecosystem-groups:
  js-locks:
    schedule:
      interval: "weekly"
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    multi-ecosystem-group: "js-locks"
    patterns: ["*"]

  # Bun (bun.lock): in the js-locks group with npm, so one PR moves package.json and bun.lock together
  - package-ecosystem: "bun"
    directory: "/"
    multi-ecosystem-group: "js-locks"
    patterns: ["*"]
