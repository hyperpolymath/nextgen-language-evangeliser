# SPDX-License-Identifier: MPL-2.0
name: CI

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2am UTC to catch dependency issues
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    if: vars.RUN_EXTENSION_CI == 'true'

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: extension/package-lock.json

    - name: Install dependencies
      run: |
        cd extension
        npm ci

    - name: Lint
      run: |
        cd extension
        npm run lint

    - name: Type check
      run: |
        cd extension
        npx tsc --noEmit

    - name: Compile
      run: |
        cd extension
        npm run compile

    - name: Run tests
      run: |
        cd extension
        npm test

    - name: Run coverage
      if: matrix.os == 'ubuntu-latest'
      run: |
        cd extension
        npm run test:coverage

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: vars.RUN_EXTENSION_CI == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: extension/package-lock.json

    - name: Install dependencies
      run: |
        cd extension
        npm ci

    - name: Run security audit
      run: |
        cd extension
        npm audit --audit-level=moderate

    - name: Check for vulnerable dependencies
      run: |
        cd extension
        npx audit-ci --moderate

  rsr-compliance:
    name: RSR Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # NON-NORMATIVE MIRROR of the RSR v2.0 criteria SSOT
    # (hyperpolymath/standards 0-canon/rsr/rsr-criteria-v2.a2ml; the ONE
    # normative checker is hypatia:rsr-conformance). Regenerate this step
    # from the SSOT detector table instead of hand-drifting it.
    #
    # Owner ruling 2026-10-10 (#78): community-health files stay AsciiDoc
    # (SECURITY.adoc, CODE_OF_CONDUCT.adoc, CONTRIBUTING.adoc). The SSOT's
    # 2.1.3/2.1.4/2.1.5 detectors list only .md variants; that detector lag
    # is reported upstream (standards#994) — GitHub community-profile
    # recognition of .adoc is requested in github/orgs/community discussions
    # #181843 and #189645. The .md variants are still ACCEPTED here so a
    # future conversion cannot fail this check.
    #
    # .well-known: canonical location is www/.well-known/ (rsr-template-repo#53,
    # stage-5 sweep); a legacy root .well-known/ is tolerated with a warning
    # during the migration window.
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check required files
      run: |
        set -u
        echo "Checking RSR compliance (mirror of rsr-criteria-v2 detectors)..."
        FAIL=0
        req()  { # req <criterion> <description> <candidate...>
          crit="$1"; desc="$2"; shift 2
          for f in "$@"; do [ -f "$f" ] && { echo "  ✅ $crit $desc ($f)"; return 0; }
          [ -d "$f" ] && { echo "  ✅ $crit $desc ($f/)"; return 0; }; done
          echo "  ❌ $crit missing $desc (looked for: $*)"; FAIL=1
        }
        # 2.1.x documentation
        req 2.1.1 README                    README.adoc README.md
        req 2.1.5 CONTRIBUTING              CONTRIBUTING.adoc .github/CONTRIBUTING.md CONTRIBUTING.md
        req 2.1.4 CODE_OF_CONDUCT           CODE_OF_CONDUCT.adoc .github/CODE_OF_CONDUCT.md CODE_OF_CONDUCT.md
        req 2.1.3 SECURITY                  SECURITY.adoc .github/SECURITY.md SECURITY.md
        req 2.1.7 MAINTAINERS               MAINTAINERS.adoc docs/MAINTAINERS.adoc
        req 2.1.6 CHANGELOG                 CHANGELOG.adoc CHANGELOG.md
        req 2.1.8 GOVERNANCE                GOVERNANCE.adoc docs/GOVERNANCE.adoc .github/GOVERNANCE.md
        req —     CLAUDE.md                 CLAUDE.md
        # 2.1.2 / 7.1.2 licensing
        req 2.1.2 LICENSE                   LICENSE
        req 7.1.2 LICENSES/MPL-2.0.txt      LICENSES/MPL-2.0.txt
        req 7.1.2 LICENSES/CC-BY-SA-4.0.txt LICENSES/CC-BY-SA-4.0.txt
        # 2.3.1 AI manifest front door
        req 2.3.1 AI-manifest               0-AI-MANIFEST.a2ml 0-AI-MANIFEST.deed
        # 1.1.2 / 1.1.3 build system: Justfile present, Makefile banned
        req 1.1.2 Justfile                  Justfile justfile
        if [ -f Makefile ] || [ -f makefile ]; then
          echo "  ❌ 1.1.3 Makefile present — estate policy is Justfile"; FAIL=1
        else
          echo "  ✅ 1.1.3 no Makefile"
        fi
        # 3.1.1 descriptiles canonical, 6a2 retired
        req 3.1.1 descriptiles              .machine_readable/descriptiles
        if [ -d .machine_readable/6a2 ]; then
          echo "  ❌ 3.1.1 retired .machine_readable/6a2/ still present"; FAIL=1
        else
          echo "  ✅ 3.1.1 no retired 6a2/"
        fi
        # 2.2.1 well-known — canonical www/, legacy root tolerated with warning
        for f in security.txt ai.txt humans.txt; do
          if [ -f "www/.well-known/$f" ]; then
            echo "  ✅ 2.2.1 www/.well-known/$f"
          elif [ -f ".well-known/$f" ]; then
            echo "  ⚠️ 2.2.1 legacy root .well-known/$f — canonical is www/.well-known/ (rsr-template-repo#53)"
          else
            echo "  ❌ 2.2.1 missing $f (want www/.well-known/$f)"; FAIL=1
          fi
        done
        if [ "$FAIL" -ne 0 ]; then
          echo "::error::RSR compliance check failed — see ❌ rows above"
          exit 1
        fi
        echo "✅ RSR compliance verified (non-normative mirror; oracle: hypatia:rsr-conformance)"

  build:
    name: Build Extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: vars.RUN_EXTENSION_CI == 'true'
    needs: [test, security, rsr-compliance]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: extension/package-lock.json

    - name: Install dependencies
      run: |
        cd extension
        npm ci

    - name: Compile
      run: |
        cd extension
        npm run compile

    - name: Package extension
      run: |
        cd extension
        npx vsce package

    - name: Upload VSIX artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: nextgen-languages-evangeliser-vsix
        path: extension/*.vsix

  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RUN_EXTENSION_CI == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: extension/package-lock.json

    - name: Install dependencies
      run: |
        cd extension
        npm ci

    - name: Run benchmarks
      run: |
        cd extension
        # TODO: Add benchmark script
        echo "Benchmarks would run here"

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20.x'

    - name: Generate docs
      run: |
        echo "Documentation generation would run here"
        # TODO: Add typedoc or similar

  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/v') && vars.RUN_EXTENSION_CI == 'true'
    needs: [build]
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: extension/package-lock.json

    - name: Install dependencies
      run: |
        cd extension
        npm ci

    - name: Package extension
      run: |
        cd extension
        npx vsce package

    - name: Create GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: extension/*.vsix
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: 'extension/*.vsix'

